<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQLi Login Challenge</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: "Open Sans", "Helvetica Neue", Arial, sans-serif;
        color: rgb(42, 42, 42);
      }

      .container {
        height: 100%;
        margin: 50px;
        text-align: center;
      }

      #login-container {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      #login-container > input {
        border: none;
        background-color: #e9e9e9;
        padding: 10px 15px;
        color: rgb(42, 42, 42);
      }

      #login-container > input:focus {
        background-color: #e4e4e4;
        outline: none;
      }

      #login-container > button {
        background-color: #cacaca;
        border: none;
        padding: 10px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        margin-top: 10px;
      }

      .success {
        text-align: center;
        font-size: larger;
        font-weight: bold;
        padding: 5px;
        background-color: rgb(210, 255, 210);
        border-radius: 5px;
      }

      .error {
        text-align: center;
        padding: 5px;
        background-color: rgb(255, 210, 210);
        border-radius: 5px;
        margin-bottom: 10px;
      }

      .sql-preview {
        margin-top: 24px;
        background-color: #f0f0f0;
        border-radius: 5px;
        padding: 12px 16px;
        font-family: monospace;
        font-size: 13px;
        text-align: left;
        word-break: break-all;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Login</h2>

      {% if flag %}
      <div class="success">Login Successful</div>
      <div style="padding-top: 10px">{{ flag }}</div>
      {% elif error %}
      <div class="error">{{ error }}</div>
      {% endif %}

      <br />

      <form method="POST" id="loginForm">
        <div id="login-container">
          <input
            type="text"
            name="username"
            id="username"
            placeholder="Username"
            autocomplete="off"
            value="{{ username }}"
          />
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Password"
            autocomplete="off"
            value="{{ password }}"
          />
          <button type="submit">Login</button>
        </div>
      </form>

      <div class="sql-preview">
        <strong>SQL Query:</strong><br />
        SELECT * FROM users WHERE username = '<span id="previewUser"></span>'
        AND password = '<span id="previewPass"></span>'
      </div>
    </div>

    <script>
      const userInput = document.getElementById("username");
      const passInput = document.getElementById("password");
      const previewUser = document.getElementById("previewUser");
      const previewPass = document.getElementById("previewPass");

      function updatePreview() {
        previewUser.textContent = userInput.value;
        previewPass.textContent = passInput.value;
      }

      userInput.addEventListener("input", updatePreview);
      passInput.addEventListener("input", updatePreview);
      updatePreview();
    </script>
  </body>
</html>
